name: CI

# Lint + type-check + tests on the LOCAL profile (a WORKING offline stack), so CI needs
# NO Google Cloud credentials and NO google-cloud-* packages. Integration tests are
# deselected. The contract tests additionally cover the onprem fail-fast family.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH_VALIDATOR_PROFILE: local

jobs:
  lint-type-test:
    name: ruff + mypy + pytest (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (dev only, no GCP SDK, locked)
        # Proves the domain + local profile install and run with no google-cloud-* deps.
        # Locked, reproducible install: the committed lockfile pins every transitive dep;
        # install the package itself with --no-deps so the lock stays authoritative (matches pip-audit).
        run: pip install -r requirements-dev.lock && pip install -e . --no-deps

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format check)
        run: ruff format --check src tests

      - name: Mypy (type-check)
        run: mypy src

      - name: Pytest (unit + contract, integration deselected)
        run: pytest -m 'not integration' -q

      - name: Demo self-test and portability proof
        run: |
          make demo-selftest
          make portability

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform offline validation
        run: make tf-validate

  supply-chain:
    name: dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      # Audit the committed lockfiles so the result matches exactly what CI and the
      # container image install. --no-deps: the locks are fully compiled (every
      # transitive dep pinned), so audit those versions without re-resolving.
      - name: pip-audit (dev + gcp lockfiles)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements-dev.lock --disable-pip --no-deps
          pip-audit -r requirements-gcp.lock --disable-pip --no-deps

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Audit the committed UI lockfile. --audit-level=high fails only on high/critical
      # advisories; dependabot (npm, /ui) proposes the bumps that clear them. A plain hard
      # gate with no date in it: a time-boxed exception rots silently, and the one this
      # replaced had stopped permitting the finding that actually failed the build.
      - name: npm audit (high severity fails the build)
        working-directory: ui
        run: npm audit --audit-level=high

  ui-build:
    name: Next.js console builds and hydrates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install + type-check + unit-test + build the thin console
        # npm audit alone cannot catch a UI-breaking dependency bump; only a real build can.
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm test
          NEXT_TELEMETRY_DISABLED=1 npm run build

      # A separate step so its failure names itself in the CI log. Everything above passed
      # while the console was shipping dead markup: a CSP with no nonce blocks Next's inline
      # hydration bootstrap, so React never attaches and no control works, while the headers,
      # the type-check and the build all stay green. This starts the BUILT server and asserts
      # every script tag in the served document carries the served nonce.
      - name: Assert the built console can actually hydrate
        working-directory: ui
        run: npm run assert-hydratable
