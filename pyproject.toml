[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "architecture-validator"
version = "0.0.1"
description = "C3 Architecture & Requirements Validator — policy-as-code intake gate that validates a project's design against the 12 General Principles (P-01..P-12), cross-checks the regulatory KB, and auto-injects the missing non-functional requirements, built ports-and-adapters on the Gemini Enterprise Agent Platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashish Awasthi" }]
keywords = ["architecture", "policy-as-code", "opa", "rego", "governance", "gemini", "adk", "gcp", "bfsi", "mas", "hkma", "apra"]

# Core deps are framework-light so the domain + on-prem/test profile install without
# any Google Cloud SDK. The managed-service adapters live in the [gcp] extra. The OPA
# policy call uses httpx (a core dep); the rego bundle is shipped as data files.
dependencies = [
  # Shared commons, pinned by tag; no build-time coupling. Public repos, so CI
  # installs them with zero credentials. hex-service-kit: outbound S2S, fail-closed net defaults,
  # StrEnum base, to_jsonable, hash-chained WORM audit. agent-eval-kit: the Hrz4
  # promotion-gate client the platform eval adapter uses.
  "hex-service-kit @ git+https://github.com/portable-genai/hex-service-kit@v0.0.5",
  "agent-eval-kit @ git+https://github.com/portable-genai/agent-eval-kit@v0.0.1",
  # review-kit: the producer half of rule R8 (route a requires_human_review escalation to the
  # Hrz7 Human-Review & Maker-Checker Console over S2S) — a shared client, never a per-repo boolean.
  "review-kit @ git+https://github.com/portable-genai/review-kit@v0.0.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "tenacity>=8.3",
  "typer>=0.12",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Pinned per mid-2026 research. ADK 2.0 was a breaking release => pin exactly.
gcp = [
  "google-adk==2.7.1",
  "google-genai>=1.21",
  "google-cloud-aiplatform[agent_engines,adk,evaluation]>=1.158.0",
  "google-cloud-discoveryengine>=0.13",
  # The live residency scanner (Cloud Asset Inventory + Security Command Center).
  "google-cloud-asset>=3.27",
  "google-cloud-securitycenter>=1.35",
  "google-cloud-logging>=3.11",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-gcp-trace>=1.7",
  "a2a-sdk[http-server]>=1.1",
  "mcp>=2.1",
]
dev = [
  "pytest>=8.2",
  # Validates the rendered Agent Plugins manifest against the vendored specification
  # schemas. A hard dev dependency, not optional: with it optional the manifest test skips,
  # and a permanently skipped test reports the same green as a passing one.
  "jsonschema>=4.26",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  # Pinned exactly: ruff's formatter output changes between releases, so an unpinned
  # version drifts from CI and fails `ruff format --check`. Bump deliberately.
  "ruff==0.16.3",
  "mypy>=1.10",
  "types-PyYAML",
  "respx>=0.21",
]

[project.scripts]
architecture-validator = "architecture_validator.cli.main:app"
# The CI-gate entry point: `residency-validator scan --plan ...`. Points at the residency
# Typer app that reuses the same command functions as the primary CLI.
residency-validator = "architecture_validator.cli.residency:app"

# Required for the commons git+https pins (direct references).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/architecture_validator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Demo scripts are presentation-only and outside the CI gate (CI lints src/tests).
# They embed long narration/HTML strings, so the line-length cap does not apply.
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires live Google Cloud credentials (deselect with -m 'not integration')",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
